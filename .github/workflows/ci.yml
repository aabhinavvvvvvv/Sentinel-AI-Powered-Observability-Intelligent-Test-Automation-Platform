# CI: on every push to main and every pull request, GitHub runs all of Sentinel's checks
# on a fresh machine. Three jobs run side by side: backend, frontend, analytics (Python).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only needs to READ the code. Giving the automatic GitHub token less power
# means a compromised step can do less damage ("least privilege").
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Throwaway Postgres and Redis containers, alive only while this job runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-password # not a secret: this database lives for one CI run
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sentinel:ci-only-password@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci # exact versions from package-lock.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test # creates + migrates sentinel_test itself (tests/global-setup.ts)
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # also type-checks (tsc --noEmit)

  analytics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinel_test # the Python tests use the test database directly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sentinel:ci-only-password@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      # The tables come from the backend's SQL migrations (one schema, owned by Node).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create the tables
        working-directory: backend
        run: npm ci && npm run migrate
        env:
          DATABASE_URL: postgres://sentinel:ci-only-password@localhost:5432/sentinel_test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - name: Install and test
        working-directory: analytics
        run: |
          pip install -r requirements.txt
          python -m pytest -q

# Local development dependencies for Sentinel.
# Start:  docker compose up -d        Stop:  docker compose down
# Data lives in the named volume `pgdata` and survives `down`.
# `docker compose down -v` deletes the volume (and all local data).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      # `:?` makes Compose refuse to start if the password is not set in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      # Bind to 127.0.0.1 so the database is NOT reachable from your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapes `$` so the variable is expanded inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis holds BullMQ's job timers ("check endpoint 5 every 60s").
  # No volume on purpose: if Redis loses its data, the worker rebuilds
  # every timer from PostgreSQL (the source of truth) when it starts.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit: a FAKE email server for development. It accepts every email and
  # shows it in a web inbox at http://localhost:8025. Nothing is really sent.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP: where Sentinel sends emails
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025" # web inbox

volumes:
  pgdata:
